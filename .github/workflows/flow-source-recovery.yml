# Temporary C0 recovery transport; removed before final FLOW-R1 handoff.
name: flow-source-recovery
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  export-public-base:
    if: github.head_ref == 'control/flow-throughput-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact public base without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: 3b567ae33f247b182b2ae451d2cc4598a9e76019
          fetch-depth: 0
          persist-credentials: false
      - name: Export public Git objects only, not worktree config or credentials
        run: |
          set -euo pipefail
          mkdir -p flow-recovery
          git bundle create flow-recovery/subject.bundle HEAD
          git bundle verify flow-recovery/subject.bundle
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path('flow-recovery/subject.bundle')
          name = 'flow-base-' + os.environ['GITHUB_RUN_ID']
          d = {'scientific_evidence': False, 'subject_sha': '3b567ae33f247b182b2ae451d2cc4598a9e76019', 'producer_run_id': os.environ['GITHUB_RUN_ID'], 'storage_location': 'github_actions_artifact:' + name, 'retention_days': 1, 'artifacts': [{'path': p.name, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'size_bytes': p.stat().st_size}]}
          Path('flow-recovery/manifest.json').write_text(json.dumps(d, indent=2) + '\n')
          PY
      - name: Publish ephemeral exact-source debug artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: flow-base-${{ github.run_id }}
          path: flow-recovery/
          retention-days: 1
          if-no-files-found: error
