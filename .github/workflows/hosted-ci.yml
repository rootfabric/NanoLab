# NanoLab — Safe GitHub-hosted CI (INFRA1-001, validation gates by INFRA1-002)
#
# Authority: docs/infra/EXECUTION_BASELINE_R1.md (EXECUTION-BASELINE-R1, ACCEPTED)
# Machine projection of this workflow: config/infra/hosted-ci.v1.json (R1 record)
#   + config/infra/validation-gates.v1.json (VALIDATION-GATES-R1 amendments)
# Documentation: docs/infra/HOSTED_CI_R1.md, docs/infra/VALIDATION_GATES_R1.md
#
# Trust route (baseline §4): this workflow serves ONLY
#   - TR-PR         pull_request targeting main (fork and in-repo alike) -> H0 only
#   - TR-PUSH-MAIN  push to refs/heads/main (canonical main)             -> H0 only
#
# FORBIDDEN_R1 routes are deliberately absent and must not be added here:
#   pull_request_target (TR-PRT), workflow_run (TR-WFRUN) — see baseline §4, NC-2, NC-7.
# Any self-hosted label in runs-on violates NC-1; hosted-unavailability must never
# fall back to another executor (NC-5, fail closed).
# These invariants are enforced mechanically by Check 4/5 (workflow NC lint).

name: hosted-ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosted-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc0-hosted-validation:
    name: RC0 hosted validation (H0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out subject (action pinned to full commit SHA, no persisted credentials)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Environment fingerprint (executor-contract context, no secrets emitted)
        run: |
          set -euo pipefail
          mkdir -p ci-debug
          {
            echo "runner_os=$RUNNER_OS"
            echo "event_name=$GITHUB_EVENT_NAME"
            echo "subject_sha=$GITHUB_SHA"
            echo "python=$(python3 --version 2>&1)"
            echo "git=$(git --version 2>&1)"
          } | tee ci-debug/environment.txt

      - name: Check 1/5 — machine contracts JSON syntax (all tracked *.json)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z '*.json')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no tracked JSON files found" >&2
            exit 1
          fi
          mkdir -p ci-debug
          : > ci-debug/check-json-syntax.txt
          # A very small set of reviewed tracked paths intentionally contains bytes
          # that are not JSON despite the historical .json suffix. They are durable
          # negative/failed-run evidence and MUST NOT be rewritten merely to satisfy
          # a filename-based syntax sweep. Each exception is fail-closed by exact
          # path + exact sha256; any byte drift fails this check and requires review.
          declare -A neg_fixtures=(
            ["experiments/evidence/E0/E0-R1/fixtures/negative/n001_empty_passport/execution/passport.json"]="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
            ["experiments/evidence/E0/E0-R1/fixtures/negative/n002_truncated_json/execution/passport.json"]="1de18ae447d83f621e98f64ef928858e9c0b1456144f10b4870bfcea8a3c4a85"
            ["docs/work/executions/EX-NL3-002-PARAM-74B-R1/evidence/arm-manifest-74b-run1.stdout.json"]="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
            ["docs/work/executions/EX-NL3-002-PARAM-74B-R1/evidence/arm-manifest-74b-run2.stdout.json"]="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          )
          neg_pinned=0
          for f in "${files[@]}"; do
            if [[ -n "${neg_fixtures[$f]+x}" ]]; then
              actual="$(sha256sum "$f" | cut -d' ' -f1)"
              if [ "$actual" != "${neg_fixtures[$f]}" ]; then
                echo "FAIL  $f (pinned non-JSON evidence drifted; reviewed erratum required)" | tee -a ci-debug/check-json-syntax.txt
                exit 1
              fi
              neg_pinned=$((neg_pinned + 1))
              echo "NEG-OK (pinned non-JSON evidence, sha256 match)  $f" | tee -a ci-debug/check-json-syntax.txt
            else
              python3 -m json.tool "$f" > /dev/null
              echo "OK  $f" | tee -a ci-debug/check-json-syntax.txt
            fi
          done
          echo "json syntax: ${#files[@]} files OK (${neg_pinned} pinned non-JSON evidence paths digest-checked)"

      - name: Check 2/5 — harness control consistency (plan/state/goals/catalog/scheduler)
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -m harness.cli check-consistency --root . | tee ci-debug/check-consistency.json

      - name: Check 3/5 — execution passports and work events integrity (all EX-*)
        run: |
          set -euo pipefail
          mkdir -p ci-debug
          : > ci-debug/check-work-events.txt
          mapfile -t dirs < <(find docs/work/executions -mindepth 1 -maxdepth 1 -type d -name 'EX-*' | sort)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "no execution dirs found under docs/work/executions" | tee -a ci-debug/check-work-events.txt
            exit 1
          fi
          status=0
          for dir in "${dirs[@]}"; do
            if PYTHONPATH=scripts python3 -m harness.work_cli validate "$dir" | tee -a ci-debug/check-work-events.txt; then
              echo "OK  $dir" | tee -a ci-debug/check-work-events.txt
            else
              echo "FAIL  $dir" | tee -a ci-debug/check-work-events.txt
              status=1
            fi
          done
          exit "$status"

      - name: Check 4/5 — workflow negative-control lint (NC-1..NC-7, blocking)
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -m harness.workflow_lint --root . | tee ci-debug/check-workflow-lint.json

      - name: Check 5/5 — validation gate unit tests (validator + lint, stdlib only)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t . -v 2>&1 | tee ci-debug/check-gate-tests.txt

      - name: Build debug artifact manifest (failure only)
        if: failure()
        env:
          ARTIFACT_NAME: hosted-ci-debug-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p ci-debug
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          debug_dir = Path("ci-debug")
          artifact_name = os.environ["ARTIFACT_NAME"]
          storage_location = f"github_actions_artifact:{artifact_name}"
          entries = []
          for path in sorted(p for p in debug_dir.rglob("*") if p.is_file() and p.name != "manifest.json"):
              payload = path.read_bytes()
              entries.append(
                  {
                      "path": path.name,
                      "sha256": hashlib.sha256(payload).hexdigest(),
                      "size_bytes": len(payload),
                      "producer_run_id": os.environ["GITHUB_RUN_ID"],
                      "subject_sha": os.environ["GITHUB_SHA"],
                      "storage_location": storage_location,
                  }
              )
          manifest = {
              "schema": "nanolab.hosted_ci_debug_manifest.v1",
              "artifact_policy": "docs/infra/EXECUTION_BASELINE_R1.md section 7",
              "kind": "hosted_ci_debug_bundle",
              "scientific_evidence": False,
              "producer_run_id": os.environ["GITHUB_RUN_ID"],
              "producer_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", "1"),
              "subject_sha": os.environ["GITHUB_SHA"],
              "storage_location": storage_location,
              "retention_days": 7,
              "artifacts": entries,
          }
          (debug_dir / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload debug artifacts (failure only, ephemeral, no secrets)
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: hosted-ci-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-debug/
          retention-days: 7
          if-no-files-found: ignore
